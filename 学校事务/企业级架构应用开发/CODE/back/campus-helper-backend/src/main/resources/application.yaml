server:
  port: 8080 # 后端服务端口

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_helper?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  # Spring AI Ollama 配置
  ai:
    ollama:
      base-url: http://localhost:11434 # 你的本地 Ollama 服务地址
      chat:
        options:
          model: qwen:7b
          temperature: 0.1 # 调低温度，让模型输出更稳定、更符合 JSON 格式

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml # 指定 XML 映射文件的位置
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名自动映射 (如 task_id 映射到 taskId)